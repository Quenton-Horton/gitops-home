apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-app
  namespace: meridian-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-app
  namespace: meridian-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-app
  namespace: meridian-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-app-minimal
  namespace: meridian-prod
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meridian-app-minimal
  namespace: meridian-prod
subjects:
- kind: ServiceAccount
  name: meridian-app
  namespace: meridian-prod
roleRef:
  kind: Role
  name: meridian-app-minimal
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-developer
  namespace: meridian-dev
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "pods/log", "deployments", "services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-developer-readonly
  namespace: meridian-prod
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "pods/log", "deployments", "services"]
  verbs: ["get", "list", "watch"]
