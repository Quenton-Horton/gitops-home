apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meridian-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Quenton-Horton/gitops-home
    targetRevision: main
    path: meridian/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: meridian-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
