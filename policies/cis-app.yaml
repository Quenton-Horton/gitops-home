apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cis-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Quenton-Horton/gitops-home
    targetRevision: main
    path: policies/cis
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
